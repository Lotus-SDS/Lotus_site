services:
  traefik:
    image: traefik:v3.5
    command:
      - "--api.dashboard=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL:?Defina ACME_EMAIL no arquivo .env}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro"
      - "./letsencrypt:/letsencrypt"
    restart: always
    networks:
      - web_network

  website:
    build:
      context: .
      dockerfile: Dockerfile # <--- AQUI APONTA PARA O DOCKERFILE DESTA PASTA
    expose:
      - "80"
    restart: always
    networks:
      - web_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lotus.rule=Host(`lotusdev.com.br`)"
      - "traefik.http.routers.lotus.entrypoints=websecure"
      - "traefik.http.routers.lotus.tls.certresolver=myresolver"
      - "traefik.http.services.lotus.loadbalancer.server.port=80"
      - "traefik.docker.network=web_network"

networks:
  web_network:
    external: true
