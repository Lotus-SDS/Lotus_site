server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # O Traefik termina o HTTPS: redirecionamentos relativos não vazam http:// nem a porta 80.
    absolute_redirect off;

    # Arquivos ocultos (.impeccable, .env...) não são servidos.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Revalida sempre (ETag): a versão nova aparece logo após o deploy.
    add_header Cache-Control "no-cache";

    # O site mora em __BASE_PATH__ (o Traefik encaminha sem cortar o prefixo).
    # Fallback para SPA: rotas desconhecidas entregam o index.html do site.
    location __BASE_PATH__ {
        try_files $uri $uri/ $uri.html __BASE_PATH__index.html;
    }
}
